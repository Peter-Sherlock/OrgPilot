# OrgPilot team roster (ADR-0009). Copy to team.yaml, fill in real members, then:
#   uv run orgpilot team import team.yaml --dry-run
#   uv run orgpilot team import team.yaml
# team.yaml is git-ignored because it holds colleagues' emails and mobiles.

project: feishu-project      # must equal ORGPILOT_FEISHU_PROJECT_ID (or --project)

members:                     # key = short alias, used only inside this file
  wang:
    email: wang@example.com  # the account's email; a "work email" set in the admin console
                             # is NOT found. Give email, mobile, or both (email is tried first).
    name: 王鹏飞
    role: pm                 # only pm starts team syncs and receives approvals
  alice:
    email: alice@example.com
    name: 支付工程师 Alice
    role: engineer           # any other role is a display label
  bob:
    mobile: 18000000002      # mainland numbers without +86; others as +<country code>...
    name: 前端工程师 Bob
    role: engineer

tasks:
  - id: task-payment
    title: 支付SDK接入
    owner: alice             # member alias
    status: doing            # todo | doing | blocked | review | done (default todo)
    deadline: 2026-10-24 18:00   # minutes required; naive times use ORGPILOT_TIMEZONE
  - id: task-checkout
    title: 收银台前端结账
    owner: bob
    deadline: 2026-10-27 18:00
    depends_on: [task-payment]
