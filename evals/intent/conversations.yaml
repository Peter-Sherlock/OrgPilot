  - id: conv_05_pm_probe_duplicate_sync
    description: 会话进行中 PM 重复 /同步 只回报状态
    occurred_at_base: "2026-10-15T14:00:00+08:00"
    setup:
      extra_tasks:
        - task_id: pm_admin
          title: 项目管理事务
          owner_id: ou_pm_zhao
          workflow_status: doing
          deadline: "2026-10-20T18:00:00+08:00"
      start_sync_by: ou_pm_zhao
    turns:
      - sender: ou_pm_zhao
        after_minutes: 5
        message: "/同步"
        expected:
          behavior:
            reply_category: noted
            starts_sync: false
    final:
      collected: []
      claims: []
      briefing_generated: false
      briefing_marks_incomplete: false

