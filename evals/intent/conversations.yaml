# 多轮对话评测脚本（ADR-0008 第 3a.1 步）。
# 标注唯一口径：evals/intent/LABELING.md（R1–R11）；oracle 模式下门槛为全部对话通过。
# 每段对话跑在全新夹具项目上；setup.start_sync_by 通过公开 API 建立真实同步会话，
# 每轮的 expected.behavior 与最终状态都会被断言。
schema_version: 1
dataset_id: intent_eval_conversations
conversations:
  # 1. 探针 → 只说风险没给时间 → 追问 → 补上时间 → 收集完成，claim 带完成时间
  - id: conv_01_probe_clarify_time
    description: 探针追问补全完成时间后收集完成
    occurred_at_base: "2026-10-15T09:00:00+08:00"
    setup:
      start_sync_by: ou_pm_zhao
    turns:
      - sender: ou_lei_chen
        after_minutes: 10
        message: "压测这边卡住了"
        expected:
          behavior:
            claims:
              - task_id: pay_e2e_test
                health_status: at_risk
            reply_category: claim_recorded
            asks_clarification: true
          intents:
            answers_pending: true
            items:
              - intent: answer_pending
                task_id: pay_e2e_test
                speech_act: statement
                polarity: affirmative
                certainty: certain
                health_status: at_risk
                source_quote: "压测这边卡住了"
      - sender: ou_lei_chen
        after_minutes: 30
        message: "预计明天下午5点能恢复"
        expected:
          behavior:
            claims:
              - task_id: pay_e2e_test
                health_status: at_risk
                expected_completion: "2026-10-16T17:00:00+08:00"
            reply_category: claim_recorded
            asks_clarification: false
          intents:
            answers_pending: true
            items:
              - intent: answer_pending
                task_id: pay_e2e_test
                speech_act: statement
                polarity: affirmative
                certainty: certain
                health_status: at_risk
                time_expression: "明天下午5点"
                source_quote: "预计明天下午5点能恢复"
    final:
      collected: [ou_lei_chen]
      claims:
        - task_id: pay_e2e_test
          health_status: at_risk
          expected_completion: "2026-10-16T17:00:00+08:00"
      briefing_generated: false
      briefing_marks_incomplete: false

