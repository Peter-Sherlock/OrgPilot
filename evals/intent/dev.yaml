# 意图评测集 dev 划分（ADR-0008 第 8 节）。
# 样本按真实团队中文口语编写，独立于现有抽取规则的关键词，禁止照抄实现关键词。
# 标注唯一口径：evals/intent/LABELING.md（R1–R10）；expected.behavior 以"系统接下来做什么"为准。
# 时间约定：晚上/今晚=20:00，中午=12:00，早上/早=10:00，下班前=18:00，月底=当月最后一天 18:00，
#   只有日期没有时刻=当天 18:00。
