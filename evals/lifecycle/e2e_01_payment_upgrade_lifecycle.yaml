# 「星云」电商 App 支付链路升级 —— 从立项到结项的全生命周期协同场景
#
# 设计文档：docs/full-lifecycle-scenario-design.md
#
# 这份场景的 ground truth 描述的是「一个正确的协调 Agent 应该怎么做」，
# 不是「当前内核实际怎么做」。两者的差距由 tests/test_lifecycle_scenario.py
# 中的 KNOWN_DEFECTS 逐条登记并按根因归类；修好一个缺陷，对应断言转绿，
# 该测试会要求同步删除登记项（棘轮），差距只能缩小，不能悄悄变大。
#
# 因此它不放在 evals/scenarios/（那里的场景必须全部通过），
# 单独运行：uv run orgpilot replay evals/lifecycle/e2e_01_payment_upgrade_lifecycle.yaml
#
# 团队：pm_carol(PM) arch_grace(架构) eng_alice/eng_bob(后端) eng_david(前端)
#       eng_emma(客户端) qa_frank(QA)
#
# DAG（基线关键路径 T1 → T2 → T4 → T6 → T7 → T8）：
#   t1_gateway ─┬─> t2_channel ─┬─> t4_cashier_h5 ─┐
#               │               └─> t5_cashier_app ┴─> t6_integration ─> t7_loadtest ─> t8_rollout
#               └─> t3_order ─────> t4_cashier_h5

schema_version: 1
scenario_id: e2e_01_payment_upgrade_lifecycle
title: Six-week payment upgrade from kickoff to closure
description: A seven-person team runs an eight-task payment upgrade over six weeks. The scenario chains
  vague risk reports, follow-up questions, reschedule approvals, conflicting claims from different reporters,
  a silently missed deadline, a leave-driven reschedule, an unresponsive member, and a regression that
  reopens a finished task. Ground truth encodes correct coordination behaviour; known kernel gaps are
  tracked in tests/test_lifecycle_scenario.py.
project_id: xingyun-payment-upgrade
rounds:

