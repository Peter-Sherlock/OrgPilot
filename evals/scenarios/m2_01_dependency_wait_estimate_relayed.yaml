        source_ref: task-system:payment-api:done
        occurred_at: "2026-11-19T16:00:00+08:00"
        received_at: "2026-11-19T16:00:01+08:00"
        payload:
          task_id: payment_api
          from_status: doing
          to_status: done
    expected_termination: all_resolved
    expected_case_statuses:
      case:dependency-wait:wait-page-api: resolved
interactive_ground_truth:
  total_rounds: 3
  final_termination_reason: all_resolved
  final_cases:
    case:dependency-wait:wait-page-api: resolved
  case_terminal_reasons:
    case:dependency-wait:wait-page-api: wait stays open until delivery
  tasks:
    payment_api:
      workflow_status: done
      health_status: unknown
    checkout_page:
      workflow_status: doing
      health_status: unknown
      deadline: "2026-11-22T18:00:00+08:00"
