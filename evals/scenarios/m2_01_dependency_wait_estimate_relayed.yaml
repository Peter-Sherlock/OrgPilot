schema_version: 1
scenario_id: m2_01_dependency_wait_estimate_relayed
title: Frontend waits on an API, the owner gives a delivery estimate, delivery releases the wait
description: >-
  Alice reports that the checkout page is waiting on Bob's payment API. The Agent asks Bob and tells
  the PM, without marking the API as delayed. Bob's estimate is relayed but does not release the
  wait. Only the API's formal completion does.
project_id: m2-dependency-wait
rounds:
  - round_number: 1
    current_time: "2026-11-18T10:00:00+08:00"
    events:
      - schema_version: 1
        project_id: m2-dependency-wait
        event_id: evt-m2-01-member-alice
        event_type: member.registered
        source: human
        source_ref: setup:alice
        occurred_at: "2026-11-18T09:00:00+08:00"
        received_at: "2026-11-18T09:00:00+08:00"
        payload:
          member_id: alice
          display_name: Alice
          role: frontend
      - schema_version: 1
        project_id: m2-dependency-wait
        event_id: evt-m2-01-member-bob
        event_type: member.registered
        source: human
        source_ref: setup:bob
        occurred_at: "2026-11-18T09:00:00+08:00"
        received_at: "2026-11-18T09:00:00+08:00"
        payload:
          member_id: bob
          display_name: Bob
          role: backend
      - schema_version: 1
        project_id: m2-dependency-wait
        event_id: evt-m2-01-member-pat
        event_type: member.registered
        source: human
        source_ref: setup:pat
        occurred_at: "2026-11-18T09:00:00+08:00"
        received_at: "2026-11-18T09:00:00+08:00"
        payload:
          member_id: pat
          display_name: Pat
          role: pm
      - schema_version: 1
        project_id: m2-dependency-wait
        event_id: evt-m2-01-task-api
        event_type: task.created
        source: task
        source_ref: task-system:payment-api
        occurred_at: "2026-11-18T09:05:00+08:00"
        received_at: "2026-11-18T09:05:00+08:00"
        payload:
          task_id: payment_api
          title: Payment API
          owner_id: bob
          workflow_status: doing
          deadline: "2026-11-20T18:00:00+08:00"
          dependencies: []
      - schema_version: 1
        project_id: m2-dependency-wait
        event_id: evt-m2-01-task-page
        event_type: task.created
        source: task
        source_ref: task-system:checkout-page
        occurred_at: "2026-11-18T09:05:00+08:00"
        received_at: "2026-11-18T09:05:00+08:00"
        payload:
          task_id: checkout_page
          title: Checkout Page
          owner_id: alice
          workflow_status: doing
          deadline: "2026-11-22T18:00:00+08:00"
          dependencies: [payment_api]
      - schema_version: 1
        project_id: m2-dependency-wait
        event_id: evt-m2-01-wait
        event_type: dependency.wait_reported
        source: message
        source_ref: message:mock-dm:alice:1
        actor_id: alice
        occurred_at: "2026-11-18T10:00:00+08:00"
        received_at: "2026-11-18T10:00:01+08:00"
        payload:
          wait_id: wait-page-api
          waiting_task_id: checkout_page
          upstream_task_id: payment_api
          quote: 页面在等支付接口
    expected_termination: waiting_response
    expected_case_statuses:
      case:dependency-wait:wait-page-api: waiting_for_response
    expected_waiting_for:
      case:dependency-wait:wait-page-api: bob
  - round_number: 2
    current_time: "2026-11-18T14:00:00+08:00"
    events:
      - schema_version: 1
        project_id: m2-dependency-wait
        event_id: evt-m2-01-estimate
        event_type: dependency.delivery_estimated
        source: message
        source_ref: message:mock-dm:bob:1
        actor_id: bob
        occurred_at: "2026-11-18T14:00:00+08:00"
        received_at: "2026-11-18T14:00:01+08:00"
        payload:
          wait_id: wait-page-api
          estimated_at: "2026-11-19T15:00:00+08:00"
          quote: 明天 15 点可联调
    expected_termination: all_resolved
    expected_case_statuses:
      case:dependency-wait:wait-page-api: resolved
  - round_number: 3
    current_time: "2026-11-19T16:00:00+08:00"
    events:
      - schema_version: 1
        project_id: m2-dependency-wait
        event_id: evt-m2-01-api-done
        event_type: task.workflow_changed
