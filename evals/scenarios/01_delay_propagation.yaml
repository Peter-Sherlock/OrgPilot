schema_version: 1
scenario_id: delay_propagation
title: A delayed prerequisite affects two downstream tasks
description: >-
  Alice reports a backend delay without a recovery estimate. The kernel must
  preserve the official workflow state, propagate impact, and ask Alice privately.
project_id: checkout-launch
